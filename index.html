const $=s=>document.querySelector(s),app=$('#app');
let S={};const KEY='quiz.tama.wrong';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
let sel=new Set(),shuf=true,onlyWrong=false;
const chs=[...new Set(D.map(d=>d.ch))];
function pool(){let p=D.filter(d=>!sel.size||sel.has(d.ch));if(onlyWrong){const w=new Set(load());p=p.filter(d=>w.has(d.id))}return p}
function home(){
 const w=load().length;
 app.innerHTML=`<h1>たましんレポート2026 練習</h1><div class="sub">全${D.length}問 ・ 解答すると解説スライドが表示されます</div>
 <h2>範囲を選ぶ(未選択=すべて)</h2><div class="chips">${chs.map(c=>`<button class="chip ${sel.has(c)?'on':''}" data-c="${c}">${c} (${D.filter(d=>d.ch==c).length})</button>`).join('')}</div>
 <div class="card"><label class="t"><input type="checkbox" id="sh" ${shuf?'checked':''}>順番をシャッフル</label>
 <label class="t"><input type="checkbox" id="ow" ${onlyWrong?'checked':''}>間違えた問題だけ(${w}問)</label></div>
 <button class="btn" id="go" ${pool().length?'':'disabled'}>スタート(${pool().length}問)</button>`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);home()});
 $('#sh').onchange=e=>shuf=e.target.checked;$('#ow').onchange=e=>{onlyWrong=e.target.checked;home()};
 $('#go').onclick=()=>start(pool());
}
function start(p){p=[...p];if(shuf)for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}S={p,i:0,ok:0,ng:[]};show()}
function show(){
 const d=S.p[S.i],n=S.p.length;
 app.innerHTML=`<div class="row"><b>${S.i+1} / ${n}</b><button class="chip" id="q">やめる</button></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="sub">${d.t}</div><div class="card"><div style="font-weight:700;margin-bottom:10px">${d.s}</div>${d.o.map((x,i)=>`<div class="item">(${i+1}) ${x}</div>`).join('')}<div id="ex" class="sub" style="margin-top:10px"></div></div><div id="ui"></div>`;
 let qt=0;$('#q').onclick=e=>{if(qt){clearTimeout(qt);home();return}e.target.textContent='もう一度タップで終了';e.target.classList.add('on');qt=setTimeout(()=>{qt=0;e.target.textContent='やめる';e.target.classList.remove('on')},3000)};
 const ui=$('#ui');
 if(d.ans){ui.innerHTML=`<div class="sub" style="margin-top:10px">設問に合う選択肢の番号を選んでください</div><div class="opts">${[1,2,3].map(k=>`<button class="opt" data-k="${k}">${k}</button>`).join('')}</div>`;
  ui.querySelectorAll('.opt').forEach(b=>b.onclick=()=>judge(d,+b.dataset.k))}
 else{ui.innerHTML=`<button class="btn" id="rv">答えを見る</button>`;$('#rv').onclick=()=>{$('#im').src=d.a;ui.innerHTML=`<div class="sub" style="margin-top:10px">自分の答えは合っていましたか?</div><div class="row"><button class="btn" id="y" style="background:var(--ok)">できた</button><button class="btn" id="n" style="background:var(--ng)">できなかった</button></div>`;$('#y').onclick=()=>mark(d,true);$('#n').onclick=()=>mark(d,false)}}
}
function judge(d,k){
 const ok=k===d.ans;$('#ex').innerHTML='<b>解説</b> '+d.e;
 $('#ui').innerHTML=`<div class="opts">${[1,2,3].map(x=>`<button class="opt ${x==d.ans?'ok':x==k?'ng':''}" disabled>${x}</button>`).join('')}</div>
 <div class="res ${ok?'ok':'ng'}">${ok?'⭕ 正解!':'❌ 不正解(正解は '+d.ans+')'}</div><button class="btn" id="nx">次へ</button>`;
 $('#nx').onclick=()=>{rec(d,ok);next()}
}
function mark(d,ok){rec(d,ok);next()}
function rec(d,ok){let w=load();if(ok){S.ok++;w=w.filter(x=>x!==d.id)}else{S.ng.push(d);if(!w.includes(d.id))w.push(d.id)}save(w)}
function next(){S.i++;S.i<S.p.length?show():done()}
function done(){
 const n=S.p.length,pc=Math.round(S.ok/n*100);
 app.innerHTML=`<h1>結果</h1><div class="big">${S.ok} / ${n}</div><div class="sub" style="text-align:center">正答率 ${pc}%</div>
 ${S.ng.length?`<h2>間違えた問題</h2><div class="card">${S.ng.map(d=>`<div class="item">${d.t}</div>`).join('')}</div><button class="btn" id="rw">間違えた問題をやり直す</button>`:'<div class="card">全問正解です!🎉</div>'}
 <button class="btn ghost" id="hm">ホームへ</button>`;
 if(S.ng.length)$('#rw').onclick=()=>start(S.ng);$('#hm').onclick=home;
}
home();
</script></body></html>
